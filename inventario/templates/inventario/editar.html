{% extends 'inventario/base.html' %}

{% block contenido %}

<h1 class="mb-4">
    Editar Insumo
</h1>

<div class="card p-4">

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <input
                type="text"
                name="nombre"
                class="form-control"
                value="{{ insumo.nombre }}"
            >

        </div>

        <div class="mb-3">

            <textarea
                name="descripcion"
                class="form-control"
            >{{ insumo.descripcion }}</textarea>

        </div>

        <button
            type="submit"
            class="btn btn-warning"
        >
            Guardar cambios
        </button>

    </form>

</div>

{% endblock %}
