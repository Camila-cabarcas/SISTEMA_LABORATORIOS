{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block titulo %}Sistema de Laboratorios{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f1f5f9; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9; padding:24px 0;">
<tr>
<td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden;">

<!-- Encabezado -->
<tr>
<td style="background-color:#2c3e50; padding:20px 32px;">
<span style="color:#ffffff; font-size:18px; font-weight:bold;">🧪 Sistema de Laboratorios</span>
</td>
</tr>

<!-- Contenido -->
<tr>
<td style="padding:32px; color:#333333; font-size:15px; line-height:1.6;">
{% block contenido %}{% endblock %}
</td>
</tr>

<!-- Pie -->
<tr>
<td style="padding:20px 32px; background-color:#f8f9fa; color:#888888; font-size:12px; line-height:1.5; border-top:1px solid #e9ecef;">
{% block pie %}
Este es un mensaje automático del Sistema de Laboratorios. Por favor no respondas a este correo.
{% endblock %}
</td>
</tr>

</table>
</td>
</tr>
</table>
</body>
</html>
