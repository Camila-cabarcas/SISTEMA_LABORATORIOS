<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Sistema de Laboratorios{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-dark bg-primary shadow-sm px-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <span class="brand-icon"><i class="fa-solid fa-flask-vial"></i></span>
            Sistema de Laboratorios
        </a>
        <span class="navbar-text text-light small d-none d-sm-inline">
            <i class="fa-solid fa-graduation-cap me-1"></i>Portal de solicitudes
        </span>
    </div>
</nav>

<main class="container mt-4 mb-5 flex-grow-1">
    {% block contenido %}{% endblock %}
</main>

<footer class="site-footer py-4">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
            <span class="footer-brand"><i class="fa-solid fa-flask-vial me-1"></i>Sistema de Laboratorios</span>
            <span class="ms-2 small">&copy; {% now "Y" %} Universidad de Antioquia</span>
        </div>
        <div class="small">
            <i class="fa-regular fa-circle-question me-1"></i>¿Necesitas ayuda? Contacta al laboratorio.
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
