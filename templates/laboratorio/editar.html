{% extends 'base_general.html' %}

{% block contenido %}

<h1 class="mb-4">Editar Laboratorio: {{ laboratorio.nombre }}</h1>

<div class="card p-4">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-warning">
            Guardar cambios
        </button>

        <a href="/laboratorio/" class="btn btn-secondary ms-2">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
