{% extends 'base_general.html' %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0"><i class="fa-solid fa-align-left text-brand me-2"></i>Descripción — {{ laboratorio.nombre }}</h2>
    <a href="{% url 'detalle_laboratorio' laboratorio.id %}?seccion=descripcion" class="btn btn-outline-secondary">&larr; Volver</a>
</div>

<div class="card shadow-sm" style="max-width: 760px;">
    <div class="card-body">
        <form method="post" novalidate id="form-descripcion">
            {% csrf_token %}
            {% include 'laboratorio/personal/partials/campos_form.html' %}
            <button type="submit" class="btn btn-success">Guardar</button>
        </form>
    </div>
</div>
{% endblock %}
