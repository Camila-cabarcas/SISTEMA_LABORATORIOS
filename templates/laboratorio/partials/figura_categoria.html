{# Figura en miniatura de una categoría de módulo (ver static/css/modulo_figura.css). Espera: color, forma. #}<span class="modulo-figura forma-{{ forma }}" style="--cat-color: {{ color }};" aria-hidden="true">{% if forma == 'computador' %}<i class="fa-solid fa-desktop modulo-figura-icono"></i>{% elif forma == 'maquinaria' %}<i class="fa-solid fa-gears modulo-figura-icono"></i>{% endif %}</span>
