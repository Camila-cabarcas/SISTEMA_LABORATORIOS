{% extends 'base_general.html' %}

{% block contenido %}

<h1 class="mb-4">Nuevo Laboratorio</h1>

<div class="card p-4">

    <form method="POST" id="crear-lab-form">

        {% csrf_token %}

        {{ form.as_p }}

        <p class="text-muted small">
            Las cuentas de laboratorista y de monitor del laboratorio se crean
            después, desde <a href="{% url 'personal' %}">Personal</a>.
        </p>

        <button type="submit" class="btn btn-primary">
            Crear Laboratorio
        </button>

        <a href="/laboratorio/" class="btn btn-secondary ms-2">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
