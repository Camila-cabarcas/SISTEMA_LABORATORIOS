{% extends 'base_general.html' %}

{% block contenido %}

<h1 class="mb-4">Eliminar Laboratorista</h1>

<div class="card p-4">
    <p>¿Estás seguro de que deseas eliminar a <strong>{{ laboratorista }}</strong> (Cédula: {{ laboratorista.cedula }})?</p>
    <p class="text-danger">Esta acción no se puede deshacer.</p>

    <form method="POST">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="/laboratorio/laboratoristas/" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

{% endblock %}
