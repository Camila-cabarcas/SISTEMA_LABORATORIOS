<h5 class="mb-3"><i class="fa-solid fa-calendar-days text-brand me-2"></i>Mis últimas reservas</h5>

{% if mis_reservas %}
<div class="card shadow-sm">
    <div class="table-responsive">
    <table class="table table-striped table-hover mb-0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Fecha Reserva</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for reserva in mis_reservas %}
            <tr>
                <td>{{ reserva.id }}</td>
                <td>{{ reserva.fecha_reserva }}</td>
                <td>{{ reserva.estado }}</td>
                <td>
                    <a href="/reservas/{{ reserva.id }}/" class="btn btn-info btn-sm">
                        <i class="fa-solid fa-eye me-1"></i>Ver detalle
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    </div>
</div>
{% else %}
<p class="text-muted">
    <i class="fa-regular fa-calendar-xmark me-1"></i>
    No tienes reservas aún. <a href="/reservas/crear/">Crear una reserva</a>
</p>
{% endif %}
