<div class="card p-4 shadow-sm" style="max-width: 720px;">
    <h4 class="mb-3"><i class="fa-solid fa-plus text-brand me-2"></i>Crear insumo</h4>

    <form method="POST" action="/inventario/?seccion=crear" novalidate>
        {% csrf_token %}

        {% include 'inventario/partials/campos_insumo.html' %}

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                <i class="fa-solid fa-floppy-disk me-1"></i>Guardar
            </button>
            <a href="/inventario/" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
