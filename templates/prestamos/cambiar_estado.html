{% extends 'base_general.html' %}

{% block contenido %}

<h1 class="mb-4">Cambiar Estado - Préstamo #{{ prestamo.id }}</h1>

<div class="card p-4">

    <p><strong>Estado actual:</strong> {{ prestamo.estado }}</p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-warning">
            Cambiar estado
        </button>

        <a href="/prestamos/{{ prestamo.id }}/" class="btn btn-secondary ms-2">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
