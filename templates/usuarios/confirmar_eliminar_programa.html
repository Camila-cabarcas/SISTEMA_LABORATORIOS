{% extends 'base_general.html' %}

{% block contenido %}

<h1 class="mb-4">Eliminar Programa</h1>

<div class="card p-4" style="max-width: 520px;">
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    <a href="/usuarios/programas/" class="btn btn-secondary">Volver</a>
    {% else %}
    <p>¿Seguro que deseas eliminar el programa <strong>{{ programa.nombre }}</strong>?</p>
    <p class="text-muted small">Esta acción no puede deshacerse.</p>
    <form method="POST">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="/usuarios/programas/" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
    {% endif %}
</div>

{% endblock %}
