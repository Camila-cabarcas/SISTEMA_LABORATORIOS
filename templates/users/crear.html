{% extends 'base_general.html' %}

{% block contenido %}

<h1 class="mb-4">Nuevo Usuario</h1>

<div class="card p-4">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Crear Usuario
        </button>

        <a href="/usuarios/" class="btn btn-secondary ms-2">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
