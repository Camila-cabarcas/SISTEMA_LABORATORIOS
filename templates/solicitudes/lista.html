{% extends 'base_general.html' %}

{% block contenido %}

<h1 class="mb-4">Solicitudes de reserva</h1>

<ul class="nav nav-tabs" id="solicitudes-tabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link {% if not buscado %}active{% endif %}" id="crear-tab" data-bs-toggle="tab"
                data-bs-target="#crear" type="button" role="tab" aria-controls="crear">
            Crear Reserva
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link {% if buscado %}active{% endif %}" id="mis-reservas-tab" data-bs-toggle="tab"
                data-bs-target="#mis-reservas" type="button" role="tab" aria-controls="mis-reservas">
            Mis Reservas
        </button>
    </li>
</ul>

<div class="tab-content border border-top-0 rounded-bottom p-4 bg-white" id="solicitudes-tabs-content">

    <div class="tab-pane fade {% if not buscado %}show active{% endif %}" id="crear" role="tabpanel" aria-labelledby="crear-tab">
        <p class="text-muted">Elige el tipo de solicitante para crear una nueva reserva:</p>
        <a href="/solicitudes/estudiante/" class="btn btn-primary me-2">
            <i class="fa-solid fa-user-graduate me-1"></i>Nueva Solicitud - Estudiante
        </a>
        <a href="/solicitudes/profesor/" class="btn btn-success">
            <i class="fa-solid fa-chalkboard-user me-1"></i>Nueva Solicitud - Profesor
        </a>
    </div>

    <div class="tab-pane fade {% if buscado %}show active{% endif %}" id="mis-reservas" role="tabpanel" aria-labelledby="mis-reservas-tab">
        {% include 'solicitudes/mis_reservas.html' %}
    </div>

</div>

{% endblock %}
